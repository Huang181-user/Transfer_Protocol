name: ZhiAuth
options:
  bundleIdPrefix: com.zhiauth

packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    from: 0.11.0

targets:
  ZhiAuthApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ZhiAuthApp
      - path: ZhiAuth
        excludes:
          - Info.plist
      - src
      - path: ZhiConfig.json
        buildPhase: resources
    infoPlist: ZhiAuthApp/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zhiauth.client
      SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/ZhiAuth/Bridge/ZhiAuth-Bridging-Header.h
      HEADER_SEARCH_PATHS: 
        - $(SRCROOT)/src/bridge
        - $(SRCROOT)/src/rpc_client
        - $(SRCROOT)/src
        - /opt/homebrew/include
        - /opt/homebrew/opt/asio/include
        - /usr/local/include
      CLANG_ENABLE_MODULES: "YES"
      OTHER_LDFLAGS: "-lc++"
      GCC_PREPROCESSOR_DEFINITIONS: "ASIO_STANDALONE=1"
    dependencies:
      - package: Sodium
