name: Build ZhiAuth iOS App

on:
  push:
    branches: [ "Client_iOS" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Lấy source code về
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt XcodeGen, ASIO & LDID
        run: |
          brew install xcodegen asio ldid
          xcodegen generate

      - name: Ép dùng Xcode 16.2.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Biên dịch Xcode Project
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ZhiAuth.xcodeproj \
            -scheme ZhiAuthApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$(PWD)/build \
            -verbose

      - name: Bơm quyền App Group bằng ldid & Đóng gói IPA
        run: |
          echo "==== ĐANG CHUẨN BỊ PAYLOAD ===="
          mkdir -p Payload
          cp -R build/Release-iphoneos/ZhiAuthApp.app Payload/
          
          echo "==== TẠO FILE ENTITLEMENTS GỐC TRÊN MÁY ẢO ===="
          cat << 'ENT' > fake.entitlements
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.com.ruanhuang.ZhiAuth</string>
              </array>
          </dict>
          </plist>
          ENT
          
          echo "==== ÉP QUYỀN APP GROUP VÀO NHÂN BINARY BẰNG LDID ===="
          ldid -Sfake.entitlements Payload/ZhiAuthApp.app/PlugIns/ZhiAuthFileProvider.appex/ZhiAuthFileProvider
          ldid -Sfake.entitlements Payload/ZhiAuthApp.app/ZhiAuthApp
          
          echo "==== ĐÓNG GÓI THÀNH IPA CHUẨN ===="
          ditto -c -k --sequesterRsrc --keepParent Payload ZhiAuthApp.ipa
          echo "✅ Đóng gói hoàn tất!"

      - name: Xuất file IPA cho Ný tải
        uses: actions/upload-artifact@v4
        with:
          name: ZhiAuthApp-iOS
          path: ZhiAuthApp.ipa
          retention-days: 7
