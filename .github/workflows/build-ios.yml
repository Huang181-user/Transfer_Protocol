name: Build ZhiAuth iOS App

on:
  push:
    branches: [ "Client_iOS" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Lấy source code về
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt XcodeGen & ASIO
        run: |
          brew install xcodegen asio
          xcodegen generate

      - name: Biên dịch Xcode Project (Sử dụng Xcode mặc định của macos-latest)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ZhiAuth.xcodeproj \
            -scheme ZhiAuthApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$(PWD)/build \
            -verbose

      - name: Đóng gói thành file .ipa chuẩn
        run: |
          echo "==== ĐANG ĐÓNG GÓI THÀNH IPA CHUẨN APPLE ===="
          mkdir -p Payload
          cp -R build/Release-iphoneos/ZhiAuthApp.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ZhiAuthApp.ipa
          echo "✅ Đóng gói hoàn tất!"

      - name: Xuất file IPA cho Ný tải
        uses: actions/upload-artifact@v4
        with:
          name: ZhiAuthApp-iOS
          path: ZhiAuthApp.ipa
          retention-days: 7
