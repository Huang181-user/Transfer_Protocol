name: Build ZhiAuth iOS App

on:
  push:
    branches: [ "Client_iOS" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Lấy source code về
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt XcodeGen & ASIO
        run: |
          brew install xcodegen asio
          xcodegen generate # Ép dịch lại project.yml thành file .xcodeproj mới nhất!

      - name: Ép dùng Xcode 16.2.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Biên dịch Xcode Project
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ZhiAuth.xcodeproj \
            -scheme ZhiAuthApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$(PWD)/build \
            -verbose

      - name: Đóng gói thành file .ipa
        run: |
          echo "==== ĐANG ĐÓNG GÓI THÀNH IPA ===="
          mkdir -p Payload
          # Copy toàn bộ app (đã nhúng C++) vào Payload
          cp -R build/Release-iphoneos/ZhiAuthApp.app Payload/
          zip -qr ZhiAuthApp.ipa Payload
          echo "✅ Đóng gói hoàn tất!"

      - name: Xuất file IPA cho Ný tải
        uses: actions/upload-artifact@v4
        with:
          name: ZhiAuthApp-iOS
          path: ZhiAuthApp.ipa
          retention-days: 7