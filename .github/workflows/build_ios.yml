name: Build unsigned IPA

on:
  push:
    branches:
      - Client_iOS
  pull_request:
    branches:
      - Client_iOS

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2.0'

    - name: Install dependencies (xcodegen & asio)
      run: |
        brew install xcodegen asio
        xcodegen generate

    - name: Build unsigned IPA
      run: |
        set -o pipefail
        xcodebuild clean build \
          -project ZhiAuth.xcodeproj \
          -scheme ZhiAuthApp \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SYMROOT=$(PWD)/build | tee build_log.txt | xcpretty

    - name: Payload repack
      run: |
        mkdir -p Payload
        cp -R build/Release-iphoneos/ZhiAuthApp.app Payload/
        zip -r ZhiAuth.ipa Payload

    - name: Upload IPA & Log
      uses: actions/upload-artifact@v4
      with:
        name: ZhiAuth-iOS-Unsigned
        path: |
          ZhiAuth.ipa
          build_log.txt
        retention-days: 7
